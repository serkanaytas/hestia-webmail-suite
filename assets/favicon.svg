<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Background: Modern Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mailGrad)" filter="url(#dropShadow)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Mail Envelope Body -->
  <rect x="12" y="18" width="40" height="28" rx="4" fill="#ffffff" filter="url(#dropShadow)"/>
  
  <!-- Envelope Flap / Creases -->
  <path d="M12 21 L32 35 L52 21" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom Corner Creases -->
  <path d="M13 44 L25 32" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M51 44 L39 32" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
</svg>

